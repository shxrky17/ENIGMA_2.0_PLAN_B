server.port=8080

# ── MySQL Database ─────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/interview_ai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=12345
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── File Upload Limits ────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Gemini AI API ─────────────────────────────────────────────────────────────
# Get your free key at: https://aistudio.google.com/app/apikey
ai.api.key=
ai.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent
ai.model=gemini-2.0-flash

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.interview=DEBUG
logging.level.org.springframework.web.socket=INFO

# FastAPI Resume Question Generator Integration
integration.fastapi.resume.enabled=true
integration.fastapi.resume.url=http://localhost:8000/analyze-resume
